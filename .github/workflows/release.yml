name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: wordpress-org-svn
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/zahls-ch-payment-gateway/
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: Check version numbers
        id: version
        run: .github/scripts/check-version.sh "${GITHUB_REF_NAME#v}"

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: zahls-ch-payment-gateway
          VERSION: ${{ steps.version.outputs.version }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.deploy.outputs.zip-path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
          body: |
            Published on WordPress.org: https://wordpress.org/plugins/zahls-ch-payment-gateway/

            ## Install
            1. Install "zahls.ch" via WordPress → Plugins → Add New, or upload `zahls-ch-payment-gateway.zip`
            2. Configure instance name and API key under WooCommerce → Settings → Payments

            Verify the ZIP: `gh attestation verify zahls-ch-payment-gateway.zip --repo zahls/zahls-plugin-woocommerce`
